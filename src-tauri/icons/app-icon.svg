<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source for all app icons: `npm run tauri icon src-tauri/icons/app-icon.svg` -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8662b"/>
      <stop offset="1" stop-color="#b4461a"/>
    </linearGradient>
    <clipPath id="above-horizon">
      <rect x="0" y="0" width="1024" height="692"/>
    </clipPath>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#background)"/>

  <!-- Rising sun: half disc on the horizon with short rays -->
  <circle cx="512" cy="692" r="232" fill="#ffd9a8" clip-path="url(#above-horizon)"/>
  <g stroke="#ffd9a8" stroke-width="44" stroke-linecap="round">
    <line x1="512" y1="412" x2="512" y2="334"/>
    <line x1="312" y1="492" x2="257" y2="437"/>
    <line x1="712" y1="492" x2="767" y2="437"/>
    <line x1="232" y1="692" x2="160" y2="692"/>
    <line x1="792" y1="692" x2="864" y2="692"/>
  </g>
  <line x1="200" y1="692" x2="824" y2="692" stroke="#ffd9a8" stroke-width="28" stroke-linecap="round"/>

  <!-- Check mark on the sun -->
  <polyline points="404,596 480,670 626,516" fill="none" stroke="#ffffff" stroke-width="78"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
